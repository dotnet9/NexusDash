<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusDash · 产品界面</title><link rel="stylesheet" href="assets/studio.css"></head>
<body><main class="window"><header class="titlebar"><img src="../../logo.png" alt=""><b>NexusDash</b><span class="spacer"></span><input id="search" data-placeholder="SearchPlaceholder"><div class="title-appearance"><div id="title-swatches"></div><button id="theme-cycle" class="appearance-icon" type="button"></button><div class="language-picker"><button id="language-button" class="appearance-icon" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2m4 0c-1 6-5 10-10 12m2-9c2 4 4 6 8 8m1 5 4-11 4 11m-7-3h6"/></svg></button><div id="title-language-menu" role="menu" hidden></div></div></div><div class="captions"><button data-window="minimize">−</button><button data-window="maximize">□</button><button data-window="close">×</button></div></header>
<div class="workspace"><nav id="nav"><button data-route="process" class="selected"><span>◴</span><span data-key="ProcessManager"></span></button><button data-route="files"><span>⌕</span><span data-key="FileSearch"></span></button><button data-route="hardware"><span>▣</span><span data-key="HardwareInfo"></span></button><button data-route="settings"><span>⚙</span><span data-key="Settings"></span></button></nav><div class="splitter"></div><div class="content"><section id="page"></section><div class="log-splitter"></div><div class="log"><div data-key="OperationLog"></div><p id="log"></p></div></div></div><footer><button id="pause" data-key="Pause"></button><button id="export" data-key="ExportSnapshot"></button><span id="status"></span><span class="spacer"></span><span id="selection-count"></span></footer></main><dialog id="confirm-dialog"><h2 data-key="ConfirmEndProcessTitle"></h2><p id="confirm-message"></p><div><button id="confirm-cancel" data-key="Cancel"></button><button id="confirm-action" data-key="Confirm"></button></div></dialog><div id="toast" role="status"></div>
<script src="assets/resources.js"></script><script src="assets/palettes.js"></script><script src="assets/studio.js"></script></body></html>
