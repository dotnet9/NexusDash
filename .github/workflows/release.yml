name: release

# 推送版本标签发布五平台 NativeAOT 安装包：win-x64、linux-x64、linux-arm64、osx-x64、osx-arm64。
# 仅提供 EXE / DEB / DMG 与 SHA-256，不提供便携压缩包。
# 安装包与校验文件汇总后创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, for example 0.1.6'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            tfm: net10.0-windows
            os: windows-latest
          - rid: linux-x64
            tfm: net10.0
            os: ubuntu-latest
          - rid: linux-arm64
            tfm: net10.0
            os: ubuntu-24.04-arm
          - rid: osx-x64
            tfm: net10.0
            os: macos-14
          - rid: osx-arm64
            tfm: net10.0
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.1.6 or 0.1.6): $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: 验证 Windows 服务元数据受控回归
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project scripts/ui-verification/UiVerification.csproj -c Release -- --telemetry-regression-only
          if ($LASTEXITCODE -ne 0) { throw 'Controlled telemetry regression failed.' }

      - name: Publish (NativeAOT with full reflection metadata)
        shell: pwsh
        run: >
          dotnet publish src/NexusDash/NexusDash.csproj -c Release
          -f ${{ matrix.tfm }} -r ${{ matrix.rid }}
          -p:PublishProfile=FolderProfile_${{ matrix.rid }}
          -p:PublishAot=true -p:PublishTrimmed=true -p:PublishSingleFile=false
          -p:IlcGenerateCompleteTypeMetadata=true -p:IlcTrimMetadata=false -p:IlcSingleThreaded=true
          -p:Version=$env:APP_VERSION

      - name: 验证正式 Windows 原生产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ('nexus-runtime-' + [guid]::NewGuid().ToString('N'))
          $start = [Diagnostics.ProcessStartInfo]::new((Resolve-Path './artifacts/publish/win-x64/NexusDash/NexusDash.exe').Path)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.ArgumentList.Add('--verify-runtime')
          $start.ArgumentList.Add($directory)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30000)) { throw 'Native runtime verification timed out.' }
          $diagnostics = Join-Path $directory 'runtime-diagnostics.txt'
          if (Test-Path -LiteralPath $diagnostics) { Get-Content -LiteralPath $diagnostics }
          if ($process.ExitCode -ne 0) { throw "Native runtime verification failed: $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $directory 'runtime-verification.txt') -Raw
          if ($result -notmatch '^NativeAOT runtime verification passed;') { throw 'Native runtime evidence is missing.' }
          Write-Output $result

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/NexusDash.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\win-x64\NexusDash
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: Compute installer SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerName = "NexusDash-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 打包 Linux deb 安装包
        if: runner.os == 'Linux'
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 打包 macOS dmg 安装镜像
        if: runner.os == 'macOS'
        shell: bash
        run: chmod +x scripts/package_macos_dmg.sh && ./scripts/package_macos_dmg.sh '${{ matrix.rid }}' "$APP_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusDash-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NexusDash-*
          path: artifacts/release
          merge-multiple: true

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # Keep the pushed tag as-is (v0.1.6 or 0.1.6) instead of creating a new one.
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.1.6 or 0.1.6): $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 校验五平台安装包与 SHA-256
        shell: pwsh
        run: ./scripts/verify_release_installers.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "Using curated release notes: $curated"
          }
          else {
            git fetch --quiet --tags origin 2>$null
            $tagMessage = git tag -l "$env:TAG_NAME" --format='%(contents)'
            if (-not [string]::IsNullOrWhiteSpace($tagMessage)) {
              $tagMessage | Set-Content -LiteralPath $bodyPath -Encoding utf8
              Write-Host "使用附注 tag 说明作为发布说明。"
            }
            else {
              "NexusDash v$env:VERSION" | Set-Content -LiteralPath $bodyPath -Encoding utf8
              Write-Host "未找到 $curated，将只使用自动生成的变更说明。"
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: NexusDash v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.sha256
