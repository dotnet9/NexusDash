<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NexusDash · 界面原型</title>
<style>
  :root { --bg:#10131a; --panel:#181c26; --line:#262c3a; --ink:#dfe4f0; --dim:#7d8598; --accent:#4f8cff; --ok:#39c26d; --warn:#e8a13c; --bad:#e05252; }
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { background:#070910; padding:28px; display:flex; justify-content:center; }
  .win { width:1080px; height:660px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 18px 44px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .titlebar { height:38px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 12px; gap:10px; font-size:12.5px; color:var(--ink); }
  .titlebar .logo { width:16px; height:16px; border-radius:4px; background:var(--accent); }
  .titlebar .tabs { display:flex; gap:2px; margin-left:10px; }
  .titlebar .tabs i { font-style:normal; padding:5px 12px; border-radius:7px; color:var(--dim); }
  .titlebar .tabs i.on { background:#1f2534; color:var(--ink); }
  .titlebar .spacer { flex:1; }
  .grid { flex:1; display:grid; grid-template-columns:1.2fr .9fr 1fr; gap:12px; padding:14px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card h4 { font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.05em; }
  .big { font-size:30px; font-weight:700; color:var(--ink); }
  .big small { font-size:13px; color:var(--dim); font-weight:400; }
  .bars { display:flex; flex-direction:column; gap:8px; font-size:11.5px; color:var(--dim); }
  .bar { height:7px; background:#232a3a; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .bar.i-cpu i { width:34%; } .bar.i-mem i { width:62%; background:var(--ok); } .bar.i-dsk i { width:18%; background:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:11.5px; color:var(--ink); }
  th { text-align:left; color:var(--dim); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  td { padding:5px 6px; border-bottom:1px solid #1d2330; }
  tr:hover td { background:#1c2231; }
  .pill { font-size:10.5px; padding:2px 8px; border-radius:99px; }
  .pill.ok { background:#12301f; color:var(--ok); }
  .pill.bad { background:#3a1518; color:var(--bad); }
  .statusbar { height:30px; border-top:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 14px; font-size:11px; color:var(--dim); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; }
  .toast { position:absolute; bottom:48px; right:22px; background:#242b3d; border:1px solid var(--line); color:var(--ink); font-size:12.5px; padding:10px 16px; border-radius:9px; opacity:0; transition:opacity .25s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="logo"></div><b>NexusDash</b>
    <div class="tabs"><i class="on">性能概览</i><i>进程管理</i><i>文件搜索</i><i>硬件信息</i><i>设置</i></div>
    <div class="spacer"></div><span style="color:var(--dim)">— □ ✕</span>
  </div>
  <div class="grid">
    <div class="card">
      <h4>CPU / 内存 / 磁盘</h4>
      <div class="big">34<small> %</small></div>
      <div class="bars">
        <span>CPU 34%</span><div class="bar i-cpu"><i></i></div>
        <span>内存 62%（16.2 / 32 GB）</span><div class="bar i-mem"><i></i></div>
        <span>磁盘活动 18%</span><div class="bar i-dsk"><i></i></div>
      </div>
    </div>
    <div class="card">
      <h4>网络</h4>
      <div class="big">8.4<small> MB/s</small></div>
      <div style="flex:1; display:flex; align-items:flex-end; gap:4px;">
        <i style="flex:1;height:30%;background:#2f4a86;border-radius:3px;display:block"></i>
        <i style="flex:1;height:55%;background:#38549b;border-radius:3px;display:block"></i>
        <i style="flex:1;height:40%;background:#33509a;border-radius:3px;display:block"></i>
        <i style="flex:1;height:75%;background:var(--accent);border-radius:3px;display:block"></i>
        <i style="flex:1;height:60%;background:#3d59a5;border-radius:3px;display:block"></i>
        <i style="flex:1;height:85%;background:#4463b4;border-radius:3px;display:block"></i>
        <i style="flex:1;height:45%;background:#4463b4;border-radius:3px;display:block"></i>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim);">
        <span>↑ 发送 2.1 MB/s</span><span>↓ 接收 6.3 MB/s</span>
      </div>
    </div>
    <div class="card">
      <h4>资源占用 Top</h4>
      <table>
        <tr><th>进程</th><th>CPU</th><th>内存</th><th>状态</th></tr>
        <tr><td>NexusDash</td><td>2.1%</td><td>148 MB</td><td><span class="pill ok">运行</span></td></tr>
        <tr><td>msedge</td><td>6.8%</td><td>512 MB</td><td><span class="pill ok">运行</span></td></tr>
        <tr><td>dotnet</td><td>12.4%</td><td>310 MB</td><td><span class="pill ok">运行</span></td></tr>
        <tr><td>legacy-svc</td><td>0.3%</td><td>42 MB</td><td><span class="pill bad">无响应</span></td></tr>
      </table>
    </div>
  </div>
  <div class="statusbar">
    <span><span class="dot"></span>监控中 · 轻量 2s / 快照 6s</span>
    <span>采集 128 个进程</span>
    <span style="flex:1"></span>
    <span id="versionBadge">NexusDash v0.1.7</span>
    <span class="link" id="checkUpdateBtn" style="color:var(--accent);cursor:pointer">检查更新</span>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
  var toast = document.getElementById('toast');
  function say(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 2600); }
  document.getElementById('checkUpdateBtn').onclick = function(){
    say('正在检查更新…');
    setTimeout(function(){ say('当前已是最新版本'); }, 1200);
  };
</script>
</body>
</html>
